apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "guestbook.name" . }}-frontend
  labels:
    {{- include "guestbook.labels" . | nindent 4 }}
    {{- include "guestbook.selector" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "guestbook.selector" (dict "ctx" . "component" "frontend") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        {{- include "guestbook.selector" (dict "ctx" . "component" "frontend") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "guestbook.selector" (dict "ctx" . "component" "frontend") | nindent 14 }}
      containers:
        - name: frontend
          image: {{ include "guestbook.image" (dict "image" .Values.frontend.image "component" "frontend") }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            # Used by nginx's /api/ proxy (for port-forwarding); the Ingress routes /api directly
            - name: API_UPSTREAM
              value: {{ include "guestbook.name" . }}-api:{{ .Values.api.port }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
