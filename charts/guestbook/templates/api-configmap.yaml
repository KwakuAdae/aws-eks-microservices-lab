apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "guestbook.name" . }}-api-config
  labels:
    {{- include "guestbook.labels" . | nindent 4 }}
data:
  TABLE_NAME: {{ .Values.api.tableName | quote }}
  GREETING: {{ .Values.api.greeting | quote }}
  PAGE_SIZE: {{ .Values.api.pageSize | quote }}
  APP_VERSION: {{ .Values.api.image.tag | quote }}
  AWS_REGION: {{ .Values.awsRegion | quote }}
