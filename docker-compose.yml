# Run the whole app locally (no AWS needed) with DynamoDB Local:
#   docker compose up --build    then open http://localhost:8080
services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  create-table:
    image: amazon/aws-cli:2.18.0
    depends_on: [dynamodb]
    environment: &fake-aws
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sleep 2 && aws dynamodb create-table --endpoint-url http://dynamodb:8000
        --table-name guestbook
        --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=created,AttributeType=N
        --key-schema AttributeName=pk,KeyType=HASH AttributeName=created,KeyType=RANGE
        --billing-mode PAY_PER_REQUEST

  api:
    build: services/api
    depends_on:
      create-table:
        condition: service_completed_successfully
    environment:
      <<: *fake-aws
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      TABLE_NAME: guestbook
      APP_VERSION: local
      GREETING: Running locally with Docker Compose

  frontend:
    build: services/frontend
    depends_on: [api]
    environment:
      API_UPSTREAM: api:8080
    ports:
      - "8080:8080"
